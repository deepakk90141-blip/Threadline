services:
  - type: web
    name: threadline-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: daphne -b 0.0.0.0 -p $PORT chatproject.asgi:application
    healthCheckPath: /health/
    disk:
      name: threadline-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: threadline-api
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: threadline-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: threadline-redis
          property: connectionString
      - key: RENDER_FRONTEND_HOST
        fromService:
          type: static
          name: threadline-frontend
          property: host
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: SERVE_MEDIA_FILES
        value: "True"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"

  - type: keyvalue
    name: threadline-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: static
    name: threadline-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    publishPath: dist
    envVars:
      - key: VITE_BACKEND_HOST
        fromService:
          type: web
          name: threadline-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: threadline-db
    databaseName: threadline
    user: threadline
    plan: basic-256mb
    ipAllowList: []
